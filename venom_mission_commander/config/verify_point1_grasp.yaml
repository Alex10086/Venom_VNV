# Skip-Nav2 module verification for CRAIC2026 point 1 dual-target payload loading.
# Bring up the arm action server and its vision/target pipeline before running.
# Run with:
#   ros2 launch venom_mission_commander mission_commander.launch.py \
#     mission_config:=$HOME/venom_ws/src/venom_vnv/venom_mission_commander/config/verify_point1_grasp.yaml \
#     use_nav:=false

mission:
  id: verify_point1_grasp
  loop: false
  stop_on_task_failure: false
  nav_timeout_sec: 350.0
  retry_count: 1

waypoints:
  - name: verify_point1_grasp_station
    description: 使用总任务一号作业点配置，默认跳过导航验证双目标装载链路。
    kind: operation_stop
    frame_id: map
    x: -4.303
    y: -0.50
    yaw: -1.57
    skip_navigation: true
    tasks:
      - name: enable_pick_yolo_for_point_1
        type: perception_control
        service_name: /pick_yolo_detector/set_enabled
        mode: start
        timeout_sec: 8.0
        service_wait_timeout_sec: 3.0
        settle_sec: 0.5
      - name: grasp_item_at_point_1
        type: grasp_item
        backend: action
        action_name: /manipulation/execute_task
        task_type_name: REPEAT_VISUAL_PICK_TO_PAYLOAD
        timeout_sec: 300.0
        server_wait_timeout_sec: 3.0
        retry_count: 0
        retry_backoff_sec: 0.5
        output_key: grasped_object
      - name: disable_pick_yolo_after_point_1
        type: perception_control
        service_name: /pick_yolo_detector/set_enabled
        mode: stop
        timeout_sec: 5.0
        service_wait_timeout_sec: 2.0
        settle_sec: 0.2
