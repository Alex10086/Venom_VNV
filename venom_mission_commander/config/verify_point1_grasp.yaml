# Skip-Nav2 module verification for CRAIC2026 point 1 grasp.
# Bring up the arm action server and its vision/target pipeline before running.
# Run with:
#   ros2 launch venom_mission_commander mission_commander.launch.py \
#     mission_config:=$HOME/venom_ws/src/venom_vnv/venom_mission_commander/config/verify_point1_grasp.yaml \
#     use_nav:=false

mission:
  id: verify_point1_grasp
  loop: false
  stop_on_task_failure: true

waypoints:
  - name: verify_point1_grasp_station
    description: 跳过导航，只验证一号作业点抓取 action 链路。
    frame_id: map
    x: 0.0
    y: 0.0
    yaw: 0.0
    skip_navigation: true
    kind: operation_stop
    tasks:
      - name: wait_for_arm_and_vision
        type: wait
        seconds: 1.0

      - name: grasp_item_at_point_1
        type: grasp_item
        backend: action
        action_name: /manipulation/execute_task
        task_type_name: PICK_AND_PLACE_LATEST_TARGET
        timeout_sec: 90.0
        server_wait_timeout_sec: 3.0
        retry_count: 1
        retry_backoff_sec: 0.5
        output_key: grasped_object
