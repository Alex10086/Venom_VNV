# Skip-Nav2 module verification for CRAIC2026 point 4 classify/place.
# Bring up the arm action server and ensure the object/preconditions are ready.
# Run with:
#   ros2 launch venom_mission_commander mission_commander.launch.py \
#     mission_config:=/home/alex/venom_ws/src/venom_vnv/venom_mission_commander/config/verify_point4_classify_place.yaml \
#     use_nav:=false

mission:
  id: verify_point4_classify_place
  loop: false
  stop_on_task_failure: true

waypoints:
  - name: verify_point4_classify_place_station
    description: 跳过导航，只验证四号作业点分类投放 action 链路。
    frame_id: map
    x: 0.0
    y: 0.0
    yaw: 0.0
    skip_navigation: true
    kind: operation_stop
    tasks:
      - name: wait_for_arm_and_object
        type: wait
        seconds: 1.0

      - name: classify_and_place_object
        type: classify_place
        backend: action
        action_name: /manipulation/execute_task
        task_type_name: CLASSIFY_PLATFORM_TO_COLOR_BOXES
        timeout_sec: 120.0
        server_wait_timeout_sec: 3.0
        retry_count: 1
        retry_backoff_sec: 0.5
        output_key: last_placement
