# Skip-Nav2 module verification for CRAIC2026 point 4 classify/place.
# Bring up the arm action server and ensure the object/preconditions are ready.
# Run with:
#   ros2 launch venom_mission_commander mission_commander.launch.py \
#     mission_config:=$HOME/venom_ws/src/venom_vnv/venom_mission_commander/config/verify_point4_classify_place.yaml \
#     use_nav:=false

mission:
  id: verify_point4_classify_place
  loop: false
  stop_on_task_failure: false
  nav_timeout_sec: 350.0
  retry_count: 1

waypoints:
  - name: verify_point4_classify_place_station
    description: 使用总任务四号作业点配置，默认跳过导航验证分类投放链路。
    kind: operation_stop
    frame_id: map
    x: -0.279
    y: -4.543
    yaw: 1.57
    skip_navigation: true
    tasks:
      - name: enable_classification_yolo_for_point_4
        type: perception_control
        service_name: /classification_yolo_detector/set_enabled
        mode: start
        timeout_sec: 8.0
        service_wait_timeout_sec: 3.0
        settle_sec: 0.5
      - name: classify_and_place_object
        type: classify_place
        backend: action
        action_name: /manipulation/execute_task
        task_type_name: CLASSIFY_PLATFORM_TO_COLOR_BOXES
        timeout_sec: 300.0
        server_wait_timeout_sec: 3.0
        retry_count: 1
        retry_backoff_sec: 0.5
        output_key: last_placement
      - name: disable_classification_yolo_after_point_4
        type: perception_control
        service_name: /classification_yolo_detector/set_enabled
        mode: stop
        timeout_sec: 5.0
        service_wait_timeout_sec: 2.0
        settle_sec: 0.2
