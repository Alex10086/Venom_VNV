grasp_target_fusion:
  ros__parameters:
    planning_frame: piper_base_link
    camera_frame: handeye_d435i_color_optical_frame
    camera_info_topic: /camera/d435i/color/camera_info
    aligned_depth_topic: /camera/d435i/aligned_depth_to_color/image_raw
    detection_topic: /perception/pick/detections_2d
    detection_array_topic: /perception/pick/detections_2d_array
    grasp_target_topic: /perception/pick/grasp_target
    target_valid_topic: /perception/pick/target_valid
    debug_topic: /perception/pick/grasp_target_debug
    min_confidence: 0.5
    target_class: black_block
    use_detection_header_stamp: true
    require_single_target: true
    default_target_size_xyz: [0.045, 0.045, 0.06]
    depth_roi_half_width_px: 8
    max_detection_age_sec: 8.0
    depth_scale: 0.001

pick_grasp_target_fusion:
  ros__parameters:
    planning_frame: piper_base_link
    camera_frame: handeye_d435i_color_optical_frame
    camera_info_topic: /camera/d435i/color/camera_info
    aligned_depth_topic: /camera/d435i/aligned_depth_to_color/image_raw
    detection_topic: /perception/pick/detections_2d
    detection_array_topic: /perception/pick/detections_2d_array
    grasp_target_topic: /perception/pick/grasp_target
    target_valid_topic: /perception/pick/target_valid
    debug_topic: /perception/pick/grasp_target_debug
    min_confidence: 0.5
    target_class: black_block
    use_detection_header_stamp: false
    require_single_target: false
    default_target_size_xyz: [0.045, 0.045, 0.06]
    depth_roi_half_width_px: 8
    max_detection_age_sec: 20.0
    depth_scale: 0.001

classify_grasp_target_fusion:
  ros__parameters:
    planning_frame: piper_base_link
    camera_frame: handeye_d435i_color_optical_frame
    camera_info_topic: /camera/d435i/color/camera_info
    aligned_depth_topic: /camera/d435i/aligned_depth_to_color/image_raw
    detection_topic: /perception/classify/detections_2d
    detection_array_topic: /perception/classify/detections_2d_array
    grasp_target_topic: /perception/classify/grasp_target
    target_valid_topic: /perception/classify/target_valid
    debug_topic: /perception/classify/grasp_target_debug
    min_confidence: 0.5
    target_class: black_box,golden_box
    use_detection_header_stamp: false
    require_single_target: false
    default_target_size_xyz: [0.045, 0.045, 0.06]
    depth_roi_half_width_px: 8
    max_detection_age_sec: 30.0
    depth_scale: 0.001
    target_center_offset_px: [0.0, 0.0]
    target_center_offset_scale_xy: [0.0, 0.0]
    use_bbox_depth_sample: true
    bbox_depth_sample_percentile: 80.0
    bbox_depth_sample_region_scale_xy: [0.55, 0.55]
    bbox_depth_sample_center_offset_scale_xy: [0.0, 0.0]
    target_ray_depth_offset_m: 0.195
    camera_target_offset_xyz: [0.0, 0.0, 0.0]
