# Static TF configuration for Scout Mini robot with tilted Livox MID-360
# Note: map->odom is dynamically published by slam_toolbox with scan matching and loop closure.
transforms:
  # Leveling transform: body (tilted Mid-360) to base_link (level chassis ground contact)
  - parent_frame: body
    child_frame: base_link
    translation: [0.0, 0.0, -0.34]
    rotation: [0.0, -0.9352, 0.0]
